<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>URL Shortener</title>
  </head>
  <body>
    <h1>URL Shortener</h1>
    <form action="/shorten" method="post">
      <label for="long_url">Enter a URL</label>
      <input id="long_url" name="long_url" type="url" required>
      <button type="submit">Shorten</button>
    </form>
  </body>
</html>
